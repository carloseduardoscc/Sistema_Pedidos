--- # DEFAULT PROFILE
spring:
  config:
    zone-id: "America/Sao_Paulo"
    frontend-url: ${FRONTEND_URL}
    access_token_lifetime:
    refresh_token_lifetime:
  application:
    name: sistema_pedidos_api
  output:
    ansi:
      enabled:
        ALWAYS
# Datasource
  jpa:
    open-in-view: false
# Security
  security:
    refresh-token:
      expiration-time: 604800000 # 7 dias
    jwt:
      expiration-time: 3600000 # 1 hora
    allowed-origins: []
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
# Logging
logging:
  level:
    root: info
  pattern.console: '%clr(%d{dd-MM-yyyy HH:mm:ss}){faint} %clr(%5p) %clr([%t]){faint} [%clr(%X{requestId}){yellow} %clr(%X{user}){red} %clr(%X{roles}){blue}] %clr(%-40.40logger{36}){cyan} %clr(:){yellow} %m%n'
# Swagger
springdoc:
  override-with-generic-response: false




--- # TEST PROFILE
spring:
  config:
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    activate:
      on-profile: test
# Datasource
  datasource:
    username: sa
    url: "jdbc:h2:mem:testdb;INIT=CREATE SCHEMA IF NOT EXISTS order_management\\;CREATE SCHEMA IF NOT EXISTS auth\\;CREATE SCHEMA IF NOT EXISTS stock"
    password: ''
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      data-locations: classpath:sql/seed-test.sql
  jpa:
    show-sql: true
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      settings:
        web-allow-others: true
      enabled: true
      path: /h2-console
  # Security
  security:
    allowed-origins: ['http://localhost:*']
    jwt:
      secret-key: "P3T09XjY7v0uUfMub4vC/16bYYsfY4XLqkquEk6w2vI="
# Logging
logging:
  level:
    br:
      com:
        carloseduscc:
          projetoestudos: debug
    org:
      springframework:
        security: debug
        web: debug
management:
  endpoints:
    web:
      exposure:
        include: '*'




--- # HOMOLOG PROFILE
spring:
  config:
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    activate:
      on-profile: homologation
# Datasource
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
# Security
  security:
    allowed-origins: ${ALLOWED_ORIGINS}
    jwt:
      secret-key: ${JWT_SECRET_KEY}
# Logging
logging:
  level:
    br:
      com:
        carloseduscc:
          projetoestudos: debug
    org:
      springframework:
        security: debug
        web: debug
  file:
    name: homolog_app.log




--- # PRODUCTION PROFILE
